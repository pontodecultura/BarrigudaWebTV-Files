<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay OBS - Barriguda TV</title>
    <style>
        :root {
            --azul: #0093d3;
            --amarelo: #f9ba13;
            --laranja: #d87721;
            --verde: #86ac41;
            --vermelho: #e63946;
            --legenda-texto-cor: #1a1a1a;
            --fundo-dark: rgba(134, 172, 65, 0.94);
            --yt-opacity-hidden: 0.3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background: transparent;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Container da Logomarca do YouTube (Fixa / Imutável com Transparência) */
        .youtube-logo-container {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .youtube-logo-container.hidden-mode {
            opacity: var(--yt-opacity-hidden);
        }

        .youtube-logo-container img {
            max-height: 60px;
            max-width: 180px;
            object-fit: contain;
            border-radius: 8px;
        }

        .youtube-logo-text {
            color: white;
            font-weight: 800;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: none; /* Ativado via JS se necessário */
        }

        /* Logos Opcionais Esquerda e Direta do Programa */
        .optional-logo {
            position: absolute;
            top: 30px;
            z-index: 9;
            max-height: 55px;
            max-width: 150px;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
            transition: opacity 0.5s ease;
        }
        .logo-left-opt { left: 240px; } /* Ajustado ao lado do YouTube */
        .logo-right-opt { right: 30px; }

        /* Container Principal da Legenda (Barra Inferior) */
        .container {
            position: absolute;
            bottom: 40px;
            width: 92%;
            left: 4%;
            display: flex;
            align-items: stretch;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(0);
            opacity: 1;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
            z-index: 5;
        }

        .container.hidden {
            opacity: 0;
            transform: translateY(100px);
            pointer-events: none;
        }

        /* Box Esquerdo (Status / Badge) */
        .badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 28px;
            color: white;
            font-weight: 800;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 12px 0 0 12px;
            min-width: 220px;
            box-shadow: 4px 0 12px rgba(0,0,0,0.3);
            z-index: 2;
            transition: background-color 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .badge::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .container:not(.hidden) .badge::before {
            left: 150%;
            transition: left 1.2s ease-in-out;
        }

        /* Box Direito (Texto da Legenda) */
        .content {
            background: var(--fundo-dark);
            font-weight: 700;
            color: var(--legenda-texto-cor);
            padding: 18px 32px;
            border-radius: 0 12px 12px 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 6px solid white;
            transition: border-color 0.4s ease;
            backdrop-filter: blur(6px);
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }
        p {
            margin: 6px 0 0 0;
            font-size: 18px;
            color: #222;
            font-weight: 600;
        }

        .dot {
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* Animações */
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(216, 119, 33, 0.8); }
            70% { box-shadow: 0 0 0 22px rgba(216, 119, 33, 0); }
            100% { box-shadow: 0 0 0 0 rgba(216, 119, 33, 0); }
        }

        .ativo-online {
            animation: pulse-glow 2.5s infinite;
        }
        .ativo-online .dot {
            animation: blink 1.2s infinite ease-in-out;
        }

        /* Cores de Estado */
        .estado-ao-vivo { background: var(--laranja) !important; }
        .estado-retransmissao { background: var(--azul) !important; }
        .estado-gravacao { background: var(--verde) !important; }
        .estado-reprise { background: var(--amarelo) !important; color: #1a1a1a !important; }
        .estado-online { background: var(--laranja) !important; }
    </style>
</head>
<body>
    <!-- Logomarca do YouTube (Imutável / Transparente ao ocultar) -->
    <div id="youtube_logo_wrapper" class="youtube-logo-container">
        <img id="img_youtube" src="" alt="Logo YouTube" style="display:none;">
    </div>

    <!-- Logos Opcionais Esquerda e Direita -->
    <img id="img_logo_esquerda" class="optional-logo logo-left-opt" src="" alt="Logo Esquerda" style="display:none;">
    <img id="img_logo_direita" class="optional-logo logo-right-opt" src="" alt="Logo Direita" style="display:none;">

    <!-- Container Principal da Legenda -->
    <div id="main_container" class="container">
        <div id="box_status" class="badge estado-online">
            <span class="dot"></span>
            <span id="txt_status">CARREGANDO</span>
        </div>
        <div id="box_info" class="content">
            <h1 id="txt_titulo">BARRIGUDA WEB TV</h1>
            <p id="txt_subtitulo">Irecê - Bahia</p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'barriguda_tv_data';

        function getData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return { programas: [], visivel: 1, youtube_logo_url: '', youtube_opacity_hidden: 0.3, logo_esquerda_url: '', logo_direita_url: '' };
        }

        function getActiveProgram(data) {
            if (!data.programas) return null;
            return data.programas.find(p => p.ativo === 1) || data.programas[0] || null;
        }

        function atualizarOverlay() {
            const data = getData();
            const container = document.getElementById('main_container');
            const ytWrapper = document.getElementById('youtube_logo_wrapper');
            const imgYoutube = document.getElementById('img_youtube');
            const imgEsquerda = document.getElementById('img_logo_esquerda');
            const imgDireita = document.getElementById('img_logo_direita');
            
            const boxStatus = document.getElementById('box_status');
            const boxInfo = document.getElementById('box_info');
            const txtTitulo = document.getElementById('txt_titulo');
            const txtSubtitulo = document.getElementById('txt_subtitulo');
            const txtStatus = document.getElementById('txt_status');

            // Configura opacidade da logo do YouTube quando oculto
            const opacityHidden = data.youtube_opacity_hidden !== undefined ? data.youtube_opacity_hidden : 0.3;
            document.documentElement.style.setProperty('--yt-opacity-hidden', opacityHidden);

            // Logomarca do YouTube
            if (data.youtube_logo_url && data.youtube_logo_url.trim() !== '') {
                imgYoutube.src = data.youtube_logo_url;
                imgYoutube.style.display = 'block';
            } else {
                imgYoutube.style.display = 'none';
            }

            // Logo Esquerda Opcional
            if (data.logo_esquerda_url && data.logo_esquerda_url.trim() !== '') {
                imgEsquerda.src = data.logo_esquerda_url;
                imgEsquerda.style.display = 'block';
            } else {
                imgEsquerda.style.display = 'none';
            }

            // Logo Direita Opcional
            if (data.logo_direita_url && data.logo_direita_url.trim() !== '') {
                imgDireita.src = data.logo_direita_url;
                imgDireita.style.display = 'block';
            } else {
                imgDireita.style.display = 'none';
            }

            // Visibilidade da Legenda e comportamento da Logo do YouTube
            if (data.visivel === 1) {
                container.classList.remove('hidden');
                ytWrapper.classList.remove('hidden-mode');
            } else {
                container.classList.add('hidden');
                ytWrapper.classList.add('hidden-mode'); // Fica meio transparente, mas NÃO some!
            }

            const programa = getActiveProgram(data);
            if (!programa) {
                txtTitulo.innerText = 'SEM SINAL';
                txtSubtitulo.innerText = 'Nenhum programa ativo';
                txtStatus.innerText = 'OFFLINE';
                return;
            }

            // Atualiza textos
            txtTitulo.innerText = programa.titulo || 'BARRIGUDA WEB TV';
            txtSubtitulo.innerText = programa.subtitulo || '';
            txtStatus.innerText = programa.estado || 'ONLINE';

            // Remove classes de estado anteriores
            boxStatus.classList.remove(
                'estado-ao-vivo', 'estado-retransmissao', 
                'estado-gravacao', 'estado-reprise', 'estado-online',
                'ativo-online'
            );

            const estado = (programa.estado || '').toUpperCase().trim();
            let corBorda = '#999';

            if (estado === 'AO VIVO') {
                boxStatus.classList.add('estado-ao-vivo', 'ativo-online');
                corBorda = 'var(--laranja)';
            } else if (estado === 'RETRANSMISSÃO') {
                boxStatus.classList.add('estado-retransmissao');
                corBorda = 'var(--azul)';
            } else if (estado === 'GRAVAÇÃO') {
                boxStatus.classList.add('estado-gravacao');
                corBorda = 'var(--verde)';
            } else if (estado === 'REPRISE') {
                boxStatus.classList.add('estado-reprise');
                corBorda = 'var(--amarelo)';
            } else {
                boxStatus.classList.add('estado-online');
                corBorda = 'var(--laranja)';
            }

            boxInfo.style.borderLeftColor = corBorda;
        }

        atualizarOverlay();
        setInterval(atualizarOverlay, 500);

        try {
            const bc = new BroadcastChannel('barriguda_sync');
            bc.onmessage = function() {
                atualizarOverlay();
            };
        } catch(e) {}

        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_KEY) {
                atualizarOverlay();
            }
        });
    </script>
</body>
</html>
