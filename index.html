<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Logos - BarrigudaWebTV</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --checker-bg: #cbd5e1;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --checker-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 24px 16px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            margin-top: 8px;
        }

        input[type="text"] {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            flex: 1;
            font-size: 0.95rem;
        }

        button {
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .btn-theme {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .folder-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .folder-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge-count {
            font-size: 0.8rem;
            background: var(--bg-body);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .preview-container {
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: var(--bg-body);
            /* Pattern de fundo quadriculado para checar transparência */
            background-image: linear-gradient(45deg, var(--checker-bg) 25%, transparent 25%), 
                              linear-gradient(-45deg, var(--checker-bg) 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, var(--checker-bg) 75%), 
                              linear-gradient(-45deg, transparent 75%, var(--checker-bg) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            justify-content: space-between;
        }

        .file-name {
            font-size: 0.85rem;
            font-weight: 600;
            word-break: break-all;
            line-height: 1.3;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button, .actions a {
            flex: 1;
            text-align: center;
            padding: 8px 10px;
            font-size: 0.75rem;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn-open {
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-copy {
            background: var(--bg-body);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Logos - BarrigudaWebTV</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Galeria de logos em LOGOS/COMPILADO</p>
        </div>
        <div>
            <button class="btn-theme" onclick="toggleTheme()">🌓 Alternar Tema</button>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Buscar por nome do arquivo de logo..." oninput="filterCards()">
        </div>
    </header>

    <div id="gallery"></div>
</div>

<script>
    // URL Base para o GitHub Pages
    const PAGES_BASE_URL = 'https://pontodecultura.github.io/BarrigudaWebTV-Files/LOGOS/COMPILADO';

    // Lista de todos os 32 arquivos presentes na pasta
    const logoFiles = [
        "Barriguda_Arvore.png",
        "Barriguda_Noticias_Logo.png",
        "Barriguda_Noticias_Transparente.png",
        "Barriguda_webtv.png",
        "EDUCAÇÃO (2).png",
        "EDUCAÇÃO.png",
        "LOGOTIPO_MODELO_XYZ001.png",
        "LOGOTIPO_MODELO_XYZ001.svg",
        "LOGOTIPO_PONTO_DE_CULTURA_PROTOTIPO.png",
        "LOGOTIPO_PONTO_DE_CULTURA_PROTOTIPO.svg",
        "Logo SME png.png",
        "Logo_Barriguda_Vertical (1).png",
        "Logo_Barriguda_Vertical_100_year.png",
        "Logo_Barriguda_Vertical_100_year_white.png",
        "Logo_Barriguda_Web_tv.png",
        "Logo_Barriguda_Web_tv_White.png",
        "Logo_Barriguda_Web_tv_logo.png",
        "Logo_vertical_Barriguda_Moderna.png",
        "Logo_vertical_Barriguda_Moderna_branco.png",
        "Logomarca_Secretaria_Nova_100anos.png",
        "Logotipo_Barriguda_Web_TV_Fonte_Branco.png",
        "WhatsApp Image 2025-10-19 at 18.54.29.jpeg",
        "WhatsApp Image 2025-10-20 at 22.15.13 (1).jpeg",
        "WhatsApp Image 2025-10-20 at 22.15.13.jpeg",
        "WhatsApp Image 2025-10-20 at 22.22.35.jpeg",
        "cropped-BAHIA-278x300.png",
        "download.png",
        "g39.png",
        "logo-undime.webp",
        "logo_proffile.png",
        "path1-8.png",
        "selo unicef oficial (1).png"
    ];

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        
        const section = document.createElement('div');
        section.className = 'folder-section';

        let cardsHtml = '';
        
        logoFiles.forEach(fileName => {
            // Encode dos caracteres especiais (espaços, parênteses, etc.) para montar URLs válidas
            const encodedName = encodeURIComponent(fileName);
            const fileUrl = `${PAGES_BASE_URL}/${encodedName}`;

            cardsHtml += `
                <div class="card" data-file-name="${fileName.toLowerCase()}">
                    <div class="preview-container">
                        <img src="${fileUrl}" alt="${fileName}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Sem+Preview';">
                    </div>
                    <div class="card-body">
                        <div class="file-name" title="${fileName}">${fileName}</div>
                        <div class="actions">
                            <a href="${fileUrl}" target="_blank" class="btn-open">Abrir</a>
                            <button class="btn-copy" onclick="copyLink('${fileUrl}', this)">Copiar URL</button>
                        </div>
                    </div>
                </div>
            `;
        });

        section.innerHTML = `
            <div class="folder-header">
                <span>📁 LOGOS / COMPILADO</span>
                <span class="badge-count" id="countBadge">${logoFiles.length} arquivos</span>
            </div>
            <div class="grid">${cardsHtml}</div>
        `;

        gallery.appendChild(section);
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        let visibleCount = 0;

        cards.forEach(card => {
            const fileName = card.getAttribute('data-file-name');
            if (fileName.includes(query)) {
                card.style.display = 'flex';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        document.getElementById('countBadge').innerText = `${visibleCount} arquivos`;
    }

    function copyLink(url, btn) {
        navigator.clipboard.writeText(url).then(() => {
            const origText = btn.innerText;
            btn.innerText = 'Copiado!';
            btn.style.background = '#22c55e';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.innerText = origText;
                btn.style.background = '';
                btn.style.color = '';
            }, 2000);
        });
    }

    function toggleTheme() {
        if (document.body.hasAttribute('data-theme')) {
            document.body.removeAttribute('data-theme');
        } else {
            document.body.setAttribute('data-theme', 'dark');
        }
    }

    // Inicializa a renderização dos cards
    renderGallery();
</script>

</body>
</html>
